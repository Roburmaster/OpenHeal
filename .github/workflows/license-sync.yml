name: Install GPL-3.0 license

on:
  push:
    branches:
      - security-baseline
    paths:
      - .github/workflows/license-sync.yml

permissions:
  contents: write

jobs:
  install-license:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security-baseline

      - name: Verify and install GPL-3.0 text
        shell: bash
        run: |
          set -euo pipefail

          SOURCE=/usr/share/common-licenses/GPL-3
          test -f "$SOURCE"
          echo "3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986  $SOURCE" | sha256sum --check --strict
          grep -q "GNU GENERAL PUBLIC LICENSE" "$SOURCE"
          grep -q "Version 3, 29 June 2007" "$SOURCE"

          cp "$SOURCE" LICENSE
          cp "$SOURCE" OpenHeal/LICENSE

      - name: Commit canonical license files
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- LICENSE OpenHeal/LICENSE; then
            echo "License files already match GPL-3.0."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE OpenHeal/LICENSE
          git commit -m "license: switch OpenHeal to GPL-3.0-only"
          git push origin HEAD:security-baseline
