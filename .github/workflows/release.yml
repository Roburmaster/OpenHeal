name: Package release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validators
        run: sudo apt-get update && sudo apt-get install --yes lua5.1 libxml2-utils

      - name: Validate Lua and XML syntax
        shell: bash
        run: |
          set -euo pipefail

          find OpenHeal -type f -name '*.lua' -print0 |
            while IFS= read -r -d '' file; do
              luac5.1 -p "$file"
            done

          find OpenHeal -type f -name '*.xml' -print0 |
            while IFS= read -r -d '' file; do
              xmllint --noout "$file"
            done

      - name: Validate tag and package addon
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          TOC_VERSION="$(sed -n 's/^## Version:[[:space:]]*//p' OpenHeal/OpenHeal.toc)"

          test -n "$VERSION"
          test "$VERSION" = "$TOC_VERSION"
          grep -Fxq '## X-License: GPL-3.0-only' OpenHeal/OpenHeal.toc
          grep -q 'GNU GENERAL PUBLIC LICENSE' LICENSE
          grep -q 'Version 3, 29 June 2007' LICENSE
          cmp --silent LICENSE OpenHeal/LICENSE

          ARCHIVE="OpenHeal-${VERSION}.zip"
          zip -r "$ARCHIVE" OpenHeal \
            -x '*/.DS_Store' '*/Thumbs.db' '*.log' '*.tmp'
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="OpenHeal-${VERSION}.zip"

          gh release create "$GITHUB_REF_NAME" \
            "$ARCHIVE" \
            "${ARCHIVE}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --verify-tag \
            --title "OpenHeal $GITHUB_REF_NAME"
